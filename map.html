<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>公司电力设施分布图</title>
    <!-- 引入地图样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 90vh; width: 100%; } /* 地图高度占屏幕90% */
        body { margin: 0; font-family: "Microsoft YaHei"; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 引入地图逻辑库 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
       var map = L.map('map').setView([23.13, 113.26], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// 在文件名后面加一个时间戳，彻底干掉缓存
fetch('data_full.geojson?t=' + new Date().getTime())
    .then(res => {
        if (!res.ok) throw new Error('服务器返回错误，状态码：' + res.status);
        return res.json();
    })
    .then(data => {
        L.geoJSON(data, {
            style: function (feature) {
                var p = feature.properties;
                // 如果是发电站（Polygon）
                if (feature.geometry.type.indexOf("Polygon") !== -1) {
                    return { fillColor: "#ff9800", color: "#e65100", weight: 2, fillOpacity: 0.7 };
                }
                // 如果是输电线（LineString）[cite: 1]
                var v = p.voltage;
                return {
                    color: v === "500000" ? "#d32f2f" : "#1976d2", // 500kV红色，其他蓝色[cite: 1]
                    weight: v === "500000" ? 5 : 2,
                    opacity: 0.8
                };
            },
           onEachFeature: function (feature, layer) {
    var p = feature.properties;
    
    // 如果有名字（如靖海厂）就用名字，没有就用“电压+线路”代替
    var voltage = p.voltage ? (parseInt(p.voltage) / 1000) + "kV" : "";
    var displayName = p.name || p["name:zh"] || p.ref || (voltage + "输电线路");

    layer.bindPopup(`
        <div style="min-width:140px">
            <b style="color:#d32f2f;">${displayName}</b><br>
            <hr style="margin:5px 0">
            <b>电压：</b>${voltage || "未知"}<br>
            <b>运营：</b>${p.operator || "南方电网"}
        </div>
    `);
}
    })
    .catch(err => console.error("地图加载出错:", err));
    </script>
</body>
</html>
