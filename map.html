<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>公司电力设施分布图</title>
    <!-- 引入地图样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 90vh; width: 100%; } /* 地图高度占屏幕90% */
        body { margin: 0; font-family: "Microsoft YaHei"; }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 引入地图逻辑库 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 创建地图，设置初始坐标（广东中心位置）和缩放等级
        var map = L.map('map').setView([23.13, 113.26], 7);

        // 2. 加载底图（这里用高德或OpenStreetMap的浅色图，背景干净）
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Power Grid Data'
        }).addTo(map);

        // 3. 开始加载你的 JSON 文件
       fetch('export(1).geojson')
            .then(res => res.json())
            .then(geojsonData => {
                renderMap(geojsonData);
            });
function renderMap(data) {
    L.geoJSON(geojsonData, {
    // 1. 设置样式：区分发电站和线路
    style: function (feature) {
        var props = feature.properties;
        // 如果是发电站（面要素）
        if (feature.geometry.type.includes("Polygon")) {
            return {
                fillColor: "#ff9800", // 橙色代表电厂
                color: "#e65100",
                weight: 2,
                fillOpacity: 0.7
            };
        }
        // 如果是输电线路（线要素）
        var v = props.voltage;
        return {
            color: v === "500000" ? "#d32f2f" : "#1976d2", // 500kV用红色，220kV用蓝色
            weight: v === "500000" ? 5 : 2,
            opacity: 0.8
        };
    },

    // 2. 处理弹窗：把名字和功率显示出来
    onEachFeature: function (feature, layer) {
        var props = feature.properties;
        
        // 自动提取名字：优先级是 名字 > 编号 > 运营商
        var name = props.name || props["name:zh"] || props.ref || props.operator || "电力设施";
        
        // 提取电压和功率
        var voltage = props.voltage ? (parseInt(props.voltage) / 1000) + "kV" : "未知";
        var output = props["plant:output:electricity"] ? `<br><b>装机容量：</b>${props["plant:output:electricity"]}` : "";

        layer.bindPopup(`
            <div style="min-width:150px">
                <b style="color:#d32f2f; font-size:14px;">${name}</b><br>
                <hr style="margin:5px 0">
                <b>类型：</b>${props.power === "plant" ? "大型发电站" : "输电线"}<br>
                <b>等级：</b>${voltage}
                ${output}
            </div>
        `);

        // 3. 鼠标悬停显示文字标签
        layer.bindTooltip(name, { sticky: true });
    }
}).addTo(map);
}
    </script>
</body>
</html>
