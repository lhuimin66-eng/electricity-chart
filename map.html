<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>广东电网物理分布图</title>
    <!-- 引入地图样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; } /* 全屏显示，视觉效果更好 */
        body { margin: 0; font-family: "Microsoft YaHei", sans-serif; }
        /* 自定义标签样式 */
        .map-label {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #999;
            padding: 2px 5px;
            font-size: 12px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- 引入地图逻辑库 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 初始化地图：中心点设在广东中部，缩放级别设为 7 以覆盖全省
        var map = L.map('map').setView([23.3, 113.5], 7);

        // 2. 加载基础底图
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. 加载全省电力数据 (添加随机数后缀 t 以防止浏览器读取旧缓存)
        fetch('data_full.geojson?t=' + new Date().getTime())
            .then(res => {
                if (!res.ok) throw new Error('数据文件加载失败，请检查文件名是否为 data_full.geojson');
                return res.json();
            })
            .then(data => {
                L.geoJSON(data, {
                    // 设置不同设施的样式
                    style: function (feature) {
                        var p = feature.properties;
                        // 如果是发电站（面要素 Polygon）
                        if (feature.geometry.type.indexOf("Polygon") !== -1) {
                            return { 
                                fillColor: "#ff9800", // 橙色
                                color: "#e65100", 
                                weight: 1, 
                                fillOpacity: 0.7 
                            };
                        }
                        // 如果是输电线（线要素 LineString）
                        var v = p.voltage;
                        return {
                            color: v === "500000" ? "#d32f2f" : "#1976d2", // 500kV红色，其他(如220kV)蓝色
                            weight: v === "500000" ? 4 : 2, // 500kV加粗显示，体现骨干网地位
                            opacity: 0.8
                        };
                    },
                    // 设置交互功能
                    onEachFeature: function (feature, layer) {
                        var p = feature.properties;
                        
                        // 动态提取名称逻辑：
                        // 1. 优先取 name (如：广东粤电靖海发电有限公司)
                        // 2. 其次取 ref (线路编号)
                        // 3. 都没有则根据电压显示 "XXXkV 输电线路"
                        var voltageLabel = p.voltage ? (parseInt(p.voltage) / 1000) + "kV" : "";
                        var displayName = p.name || p["name:zh"] || p.ref || (voltageLabel + "输电线路");

                        // 构造弹窗内容
                        var popupContent = `
                            <div style="min-width:160px; line-height: 1.6;">
                                <b style="color:#d32f2f; font-size: 14px;">${displayName}</b><br>
                                <hr style="margin: 5px 0; border: 0; border-top: 1px solid #eee;">
                                <b>设施类型：</b>${p.power === 'plant' ? '生产电源' : '骨干网络'}<br>
                                <b>电压等级：</b>${voltageLabel || "未知"}<br>
                                ${p.operator ? '<b>运营单位：</b>' + p.operator : '<b>运营单位：</b>南方电网'}
                                ${p["plant:output:electricity"] ? '<br><b>装机容量：</b>' + p["plant:output:electricity"] : ''}
                            </div>
                        `;
                        layer.bindPopup(popupContent);

                        // 鼠标悬停时显示简单提示
                        layer.bindTooltip(displayName, { sticky: true });
                    }
                }).addTo(map);
            })
            .catch(err => {
                console.error("地图渲染出错:", err);
                alert("数据加载失败，请确认 data_full.geojson 已上传至仓库根目录。");
            });
    </script>
</body>
</html>
